<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; letter-spacing: 0; }
    body {
      width: 390px;
      max-height: 660px;
      margin: 0;
      overflow: auto;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(circle at 15% -5%, rgba(45, 212, 191, 0.26), transparent 34%),
        radial-gradient(circle at 100% 10%, rgba(139, 92, 246, 0.32), transparent 32%),
        linear-gradient(135deg, #0f172a, #020617);
    }
    .shell { padding: 16px; }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand img {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      box-shadow: 0 14px 32px rgba(45, 212, 191, 0.22);
    }
    .brand strong {
      display: block;
      color: #ffffff;
      font-size: 17px;
      font-weight: 900;
    }
    .brand span {
      display: block;
      margin-top: 2px;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 850;
    }
    .pill.online { color: #86efac; background: rgba(34, 197, 94, 0.12); }
    .pill.offline { color: #fda4af; background: rgba(244, 63, 94, 0.13); }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.04);
    }
    .hero {
      position: relative;
      overflow: hidden;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 22px 60px rgba(2, 6, 23, 0.36);
      backdrop-filter: blur(20px);
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: -40% 30% auto -30%;
      height: 160px;
      background: linear-gradient(90deg, rgba(45,212,191,0.22), rgba(139,92,246,0.22));
      transform: rotate(-8deg);
    }
    .hero > * { position: relative; }
    .title {
      margin: 0;
      color: #ffffff;
      font-size: 15px;
      font-weight: 900;
    }
    .copy {
      margin: 6px 0 0;
      color: #b6c2d6;
      font-size: 12px;
      line-height: 1.45;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 14px;
    }
    button {
      min-height: 40px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 13px;
      color: #e2e8f0;
      background: rgba(255,255,255,0.08);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 850;
    }
    button.primary {
      border-color: rgba(45,212,191,0.38);
      color: #06121f;
      background: linear-gradient(135deg, #5eead4, #93c5fd);
      box-shadow: 0 12px 26px rgba(45, 212, 191, 0.22);
    }
    button:hover { filter: brightness(1.05); }
    button:disabled { opacity: 0.56; cursor: default; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .stat {
      padding: 11px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 15px;
      background: rgba(255,255,255,0.07);
    }
    .stat strong {
      display: block;
      color: #ffffff;
      font-size: 20px;
      font-weight: 950;
    }
    .stat span {
      display: block;
      margin-top: 3px;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .result {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }
    .score {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px;
      border: 1px solid rgba(52, 211, 153, 0.28);
      border-radius: 17px;
      color: #bbf7d0;
      background: rgba(34, 197, 94, 0.11);
    }
    .score.medium {
      color: #fde68a;
      border-color: rgba(251, 191, 36, 0.3);
      background: rgba(251, 191, 36, 0.11);
    }
    .score.high {
      color: #fecdd3;
      border-color: rgba(251, 113, 133, 0.32);
      background: rgba(244, 63, 94, 0.12);
    }
    .score-label {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .score-verdict {
      margin-top: 5px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 900;
      line-height: 1.28;
    }
    .score-number {
      color: #ffffff;
      font-size: 28px;
      font-weight: 950;
      white-space: nowrap;
    }
    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }
    .mini,
    .insight {
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 15px;
      background: rgba(255,255,255,0.075);
    }
    .mini span,
    .insight span {
      display: block;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .mini strong,
    .insight strong {
      display: block;
      margin-top: 6px;
      color: #ffffff;
      font-size: 12px;
      line-height: 1.36;
      overflow-wrap: anywhere;
    }
    .insight.info { border-color: rgba(56, 189, 248, 0.28); background: rgba(56, 189, 248, 0.1); }
    .insight.ok { border-color: rgba(52, 211, 153, 0.26); background: rgba(52, 211, 153, 0.1); }
    .insight.warn { border-color: rgba(251, 191, 36, 0.3); background: rgba(251, 191, 36, 0.1); }
    .insight.ai { border-color: rgba(129, 140, 248, 0.34); background: rgba(79, 70, 229, 0.13); }
    .insight p {
      margin: 6px 0 0;
      color: #b6c2d6;
      font-size: 12px;
      line-height: 1.38;
    }
    .insight ul,
    .flags {
      display: grid;
      gap: 7px;
      padding: 0;
      margin: 8px 0 0;
      list-style: none;
    }
    .insight li,
    .flags li {
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.35;
    }
    .flags {
      margin-top: 0;
    }
    .flags li {
      padding: 9px 10px;
      border: 1px solid rgba(251, 191, 36, 0.2);
      border-radius: 12px;
      color: #fde68a;
      background: rgba(251, 191, 36, 0.09);
    }
    .flags li.ok {
      color: #bbf7d0;
      border-color: rgba(52, 211, 153, 0.25);
      background: rgba(52, 211, 153, 0.09);
    }
    .loading {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 12px;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 800;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.16);
      border-top-color: #5eead4;
      border-radius: 999px;
      animation: spin 0.8s linear infinite;
    }
    .hint {
      margin-top: 12px;
      color: #8190aa;
      font-size: 11px;
      line-height: 1.4;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="top">
      <div class="brand">
        <img src="icons/icon48.png" alt="">
        <div>
          <strong>PhishGuard</strong>
          <span>Email threat intelligence</span>
        </div>
      </div>
      <div class="pill" id="backend-status"><span class="dot"></span><span>Checking</span></div>
    </div>

    <section class="hero">
      <p class="title">Active Gmail protection</p>
      <p class="copy" id="status-text">Open a Gmail message, then scan it here or show the in-page intelligence panel.</p>
      <div class="actions">
        <button class="primary" id="scan-btn" type="button">Scan popup</button>
        <button id="panel-btn" type="button">Show panel</button>
        <button id="clear-btn" type="button">Clean page</button>
        <button id="gmail-btn" type="button">Open Gmail</button>
      </div>
    </section>

    <section class="stats">
      <div class="stat"><strong id="stat-scanned">0</strong><span>Scanned</span></div>
      <div class="stat"><strong id="stat-threats">0</strong><span>Threats</span></div>
      <div class="stat"><strong id="stat-safe">0</strong><span>Safe</span></div>
    </section>

    <div id="result"></div>
    <div class="hint">Origin uses sender-domain DNS fallback when Gmail hides raw sender IP headers.</div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
